<!DOCTYPE html>
<html>
<head>
    <title>errorScreen</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <h1>Settings</h1>
    <nav>
        <a href="/">Menu</a> |
        <a href="/addGateway">Add Gateway</a> |
        <a href="/settings">Settings</a>
<!--        |-->
<!--        <a href="/errorScreen">Server Disconnected</a> |-->
<!--        <a href="/wikiSearch">Search Wikipedia</a>-->
    </nav>

    <p>Settings for the mesh device. TODO: Add instructions on how to find the values (and for MacOS, linux, etc)</p>

    <div class="setting-box">
      <label for="mesh_port">Mesh Device Port</label>
      <input type="text" id="mesh_port" name="mesh_port" value="/dev/cu.usbserial-0001">
    </div>

    <button type="submit" class="confirm-btn">Save Settings</button>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const inputs = document.querySelectorAll('.setting-box input');
        const submitBtn = document.querySelector('.confirm-btn');

        // 1. LOAD SAVED DATA: Check localStorage when the page loads
        inputs.forEach(input => {
          const savedValue = localStorage.getItem(input.id);
          if (savedValue !== null) {
            input.value = savedValue; // Overwrite default with saved value
          }
        });

        // 2. ENTER KEY LOGIC: Move to next box or submit
        inputs.forEach((input, index) => {
          input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
              event.preventDefault();
              if (index < inputs.length - 1) {
                inputs[index + 1].focus();
              } else {
                submitBtn.click();
              }
            }
          });
        });

        // 3. SAVE DATA: Store values in localStorage when confirmed
        submitBtn.addEventListener('click', async (event) => {
          event.preventDefault();

          inputs.forEach(input => {
            localStorage.setItem(input.id, input.value);
          });

          const portValue = document.getElementById('mesh_port').value;

          try {
              // Send the port to the Python backend
              const response = await fetch('/connect_mesh_device', {
                  method: 'POST',
                  headers: {
                      'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({ port: portValue })
              });

              const result = await response.json();

              if (result.status === 'success') {
                  alert('Connected! ' + result.message);
              } else {
                  alert('Connection failed: ' + result.message);
              }
          } catch (error) {
              alert('Network error communicating with server.');
          }
        });
      });
    </script>
</body>
</html>
