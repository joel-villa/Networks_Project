<!DOCTYPE html>
<html>
<head>
    <title>Add Gateway</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <h1>Add Gateway</h1>
    <nav>
        <a href="/">Menu</a> |
        <a href="/addGateway">Add Gateway</a> |
        <a href="/settings">Settings</a>
    </nav>

    <p>Enter the gateway credentials to initiate a connection.</p>

    <!-- Added a dedicated div for status messages -->
    <div id="status-message" style="margin-bottom: 15px; font-weight: bold;"></div>

    <!-- Wrapped inputs in a form -->
    <form id="gateway-form">
        <div class="setting-box">
            <label for="gateway_name">Gateway Name</label>
            <input type="text" id="gateway_name" name="gateway_name" required>
        </div>

        <div class="setting-box">
            <!-- Ensure name matches the FastAPI parameter 'public_key' -->
            <label for="public_key">Gateway Public Key</label>
            <input type="text" id="public_key" name="public_key" required>
        </div>

        <button type="submit" class="confirm-btn">Connect to Gateway</button>
    </form>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById('gateway-form');
        const inputs = document.querySelectorAll('.setting-box input');
        const submitBtn = document.querySelector('.confirm-btn');
        const statusDiv = document.getElementById('status-message');

        // Load saved data
        inputs.forEach(input => {
          const savedValue = localStorage.getItem(input.id);
          if (savedValue !== null) {
            input.value = savedValue;
          }
        });

        // Move to next box or submit
        inputs.forEach((input, index) => {
          input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
              event.preventDefault();
              if (index < inputs.length - 1) {
                inputs[index + 1].focus();
              } else {
                submitBtn.click();
              }
            }
          });
        });

        // Save locally and send to backend
        form.addEventListener('submit', async (event) => {
          event.preventDefault(); // Prevent standard page reload

          // Save to local storage
          inputs.forEach(input => {
            localStorage.setItem(input.id, input.value);
          });

          statusDiv.style.color = "blue";
          statusDiv.innerText = "Connecting to mesh and searching for gateway...";
          submitBtn.disabled = true; // Prevent double-clicking

          try {
            // Collect form data
            const formData = new FormData(form);

            // Send POST request to FastAPI backend
            const response = await fetch('/addGateway', {
              method: 'POST',
              body: formData
            });

            const result = await response.json();

            // Handle the backend response
            if (result.error) {
              statusDiv.style.color = "red";
              statusDiv.innerText = result.error;
            } else {
              statusDiv.style.color = "green";
              statusDiv.innerText = result.message;
            }
          } catch (error) {
            statusDiv.style.color = "red";
            statusDiv.innerText = "Network error: Could not reach the server.";
          } finally {
            submitBtn.disabled = false;
          }
        });
      });
    </script>
</body>
</html>
