<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>
    <h1>Search Wikipedia</h1>
    <nav>
        <a href="/">Home</a> |
        <a href="/errorScreen">Server Disconnected</a> |
        <a href="/wikiSearch">Search Wikipedia</a>
    </nav>

    <!-- NEW: Text box and button -->
    <div style="margin-bottom: 15px;">
        <input type="text" id="searchBox" placeholder="Enter Wikipedia topic...">
        <button onclick="updateIframe()">Search</button>
    </div>

    <!-- ADDED ID: "contentIframe" so JavaScript can control it -->
    <iframe id="contentIframe" src="/embeddedText" width="100%" height="300px" style="border: 2px solid #333; border-radius: 5px;"></iframe>

    <!-- NEW: JavaScript to update the iframe URL -->
    <script>
        function updateIframe() {
            // 1. Get the text the user typed in the box
            const query = document.getElementById("searchBox").value;

            // 2. Find the iframe on the page
            const iframe = document.getElementById("contentIframe");

            // 3. Update the iframe's source URL.
            // encodeURIComponent ensures spaces and special characters are URL-safe.
            iframe.src = "/embeddedText?q=" + encodeURIComponent(query);
        }
    </script>
