<!DOCTYPE html>
<html>
<head>
    <title>Search Wikipedia</title>
</head>
<body>
    <h1>Search Wikipedia</h1>
    <nav>
        <a href="/">Home</a> |
        <a href="/errorScreen">Server Disconnected</a> |
        <a href="/wikiSearch">Search Wikipedia</a>
    </nav>


    <form action="/embeddedText" method="GET" target="contentIframe" style="margin: 15px;">
        <!-- The name="q" is what Python will look for -->
        <input type="text" name="q" placeholder="Enter Wikipedia topic...">
        <button type="submit">Search</button>
    </form>

    <!-- The 'name' attribute must match the form's 'target' attribute -->
    <iframe name="contentIframe" src="/embeddedText" width="100%" height="300px" style="border: 2px solid #333; border-radius: 5px;"></iframe>
</body>
